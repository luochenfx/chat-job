spring:
  application:
    name: chat-job
  datasource:
    # 单机单文件。WAL + busy_timeout 是必须的：控制台读写与 Run 线程写日志会并发，
    # 不开 WAL 会直接抛 database is locked。
    #
    # 路径必须经 chat-job.home 展开，不能写 ./data —— 相对路径的基准是 JVM 工作目录，
    # 而工作目录会随启动方式变化（start.bat 在仓库根、spring-boot:run 在 server/、
    # IDE 看运行配置），结果是同一台机器上出现两个库、各自静默工作。
    # 详见 com.chatjob.config.ProjectHome。
    url: jdbc:sqlite:${chat-job.home}/data/chat-job.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # 只绑本机回环，绝不对外监听（C1）
  address: 127.0.0.1
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/event-stream

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.chatjob: DEBUG
  file:
    name: ${chat-job.home}/data/logs/chat-job.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 10MB

chat-job:
  # 运行时数据的唯一锚点。默认由 ProjectHome 在启动时探测（<项目根>/server/target/... 反查），
  # 命令行 -Dchat-job.home= 或环境变量 CHAT_JOB_HOME 可显式覆盖。
  # 写成 ${user.dir} 只是备用取值：没有 HomeEnvironmentPostProcessor 时（例如裸单测）不至于解析失败。
  home: ${user.dir}
  # 缺省平台：boss / zhaopin。阶段 2b 起两个平台的适配器同时装配，这里只决定
  # 「调用方没有显式指定平台时落到哪个」——控制台不带 platform 参数、脚本不加参数时用它。
  # 环境变量 CHAT_JOB_ACTIVE_PLATFORM 可覆盖。
  active-platform: ${CHAT_JOB_ACTIVE_PLATFORM:boss}
  driver:
    # patchright driver 目录，构建期由 scripts/install-patchright.mjs 生成
    dir: ${chat-job.home}/build/patchright-driver
    # 找不到 driver 时拒绝启动任务（fail-closed），不得静默退回官方 driver
    fail-closed: true
  browser:
    # 专用 profile 的根目录。实际用的是它下面的平台子目录（boss / zhaopin）：
    # 同一个 user-data-dir 有独占锁，两平台共用一个目录时第二个浏览器起不来；
    # 登录态也是各平台各自扫各自的码，不该混在一个 profile 里。
    # 阶段 2a 之前这里就是 boss 的 profile，browser-data/boss 是它的原样搬迁。
    user-data-dir: ${chat-job.home}/browser-data
    # 每个动作固定加的均匀延迟。阶段 2 归零（ADR-0007 第 5 条）：
    # 均匀延迟本身可统计，且会与本层的随机间隔叠加成两种节奏。
    # 保留这个字段而不是删掉，是为了关掉 humanize 时还能一键回到改造前的固定节奏做对比。
    slow-mo-ms: 0
    default-timeout-ms: 30000
    # auto = 按 chrome → msedge 探测本机已装的那个；也可写死 chrome / msedge。
    # 解析结果会显示在控制台"系统"页，不做静默降级。
    channel: auto
    # 显式指定浏览器可执行文件，优先级高于 channel
    executable-path: ""
  self-check:
    # 启动自检页：用 data URL 断言 navigator.webdriver 等指纹
    enabled: true
  # 人类化交互层（spec 0006 / ADR-0007）。这里列出的值就是当前生效值；
  # 代码里另有一套等价默认值（HumanizeConfig），yaml 整段缺失时用那套。
  # 单位写在字段名里，不靠注释约定。
  humanize:
    # 总开关。true 时所有点击、输入、滚动都经本层；false 时每个方法
    # 等价于改造前的原生写法（locator.click / fill / window.scrollBy），且不产生任何计数——
    # 于是 run_log 里也不会出现「人类化交互 …」汇总行，可与改造前逐行比对。
    enabled: true
    # 0 = 真随机；非 0 可复现同一条轨迹（把 run_log 里的种子填回来即可重放）
    seed: 0
    mouse:
      steps: {min: 18, max: 34}
      # 落点的相对位置：center=0.5 表示元素中线，超出 max-deviation 的样本丢弃重采。
      # 只有落点用高斯，所以不写 kind —— 写了也不会被读，属于死配置。
      jitter: {center: 0.5, sigma: 0.15, max-deviation: 0.4}
      # 纵向漂移阈值取 max(drift-px, 元素高 × drift-ratio)；超过就作废重算，
      # 重算 realign-rounds 次仍漂移则降级为原生点击
      drift-px: 8
      drift-ratio: 0.25
      realign-rounds: 2
      hold-ms: {min: 40, max: 120}
    keyboard:
      char-delay-ms: {min: 55, max: 165}
      # 每 8–15 个字之后额外加一次长停顿（窗口长度每次重抽，避免整除关系）
      thinking-pause-ms: {min: 250, max: 900}
      # 打错一个字符再删掉重输的概率。只对 ASCII 字母与数字生效，中文不走这条路
      mistype-chance: 0.02
      # 输入完成后静置多久再读回文本、比对 DOM 结构
      verify-settle-ms: 300
    scroll:
      # 单步位移占视口高的比例。一次"滚动计划"（累计达到目标）算一轮，
      # ScrollParams.roundLimit 的口径不变
      step-ratio: {min: 0.35, max: 0.85}
      step-interval-ms: {min: 90, max: 260}
    warm-up:
      enabled: true
      max-duration-ms: 3000
      scroll-steps: {min: 2, max: 4}
      dwell-ms: {min: 600, max: 1500}
    pacing:
      # 两次交互之间的间隔。适配器里原来的 pause(min, max) 由它接管，区间数值原样保留
      between-actions-ms: {min: 400, max: 900}
  notify-config:
    wecom-webhook: ""
    throttle-window-seconds: 300
