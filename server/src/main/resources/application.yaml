spring:
  application:
    name: chat-job
  datasource:
    # 单机单文件。WAL + busy_timeout 是必须的：控制台读写与 Run 线程写日志会并发，
    # 不开 WAL 会直接抛 database is locked。
    #
    # 路径必须经 chat-job.home 展开，不能写 ./data —— 相对路径的基准是 JVM 工作目录，
    # 而工作目录会随启动方式变化（start.bat 在仓库根、spring-boot:run 在 server/、
    # IDE 看运行配置），结果是同一台机器上出现两个库、各自静默工作。
    # 详见 com.chatjob.config.ProjectHome。
    url: jdbc:sqlite:${chat-job.home}/data/chat-job.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  # 只绑本机回环，绝不对外监听（C1）
  address: 127.0.0.1
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/event-stream

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.chatjob: DEBUG
  file:
    name: ${chat-job.home}/data/logs/chat-job.log
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 10MB

chat-job:
  # 运行时数据的唯一锚点。默认由 ProjectHome 在启动时探测（<项目根>/server/target/... 反查），
  # 命令行 -Dchat-job.home= 或环境变量 CHAT_JOB_HOME 可显式覆盖。
  # 写成 ${user.dir} 只是备用取值：没有 HomeEnvironmentPostProcessor 时（例如裸单测）不至于解析失败。
  home: ${user.dir}
  # 缺省平台：boss / zhaopin。阶段 2b 起两个平台的适配器同时装配，这里只决定
  # 「调用方没有显式指定平台时落到哪个」——控制台不带 platform 参数、脚本不加参数时用它。
  # 环境变量 CHAT_JOB_ACTIVE_PLATFORM 可覆盖。
  active-platform: ${CHAT_JOB_ACTIVE_PLATFORM:boss}
  driver:
    # patchright driver 目录，构建期由 scripts/install-patchright.mjs 生成
    dir: ${chat-job.home}/build/patchright-driver
    # 找不到 driver 时拒绝启动任务（fail-closed），不得静默退回官方 driver
    fail-closed: true
  browser:
    # 专用 profile 的根目录。实际用的是它下面的平台子目录（boss / zhaopin）：
    # 同一个 user-data-dir 有独占锁，两平台共用一个目录时第二个浏览器起不来；
    # 登录态也是各平台各自扫各自的码，不该混在一个 profile 里。
    # 阶段 2a 之前这里就是 boss 的 profile，browser-data/boss 是它的原样搬迁。
    user-data-dir: ${chat-job.home}/browser-data
    slow-mo-ms: 50
    default-timeout-ms: 30000
    # auto = 按 chrome → msedge 探测本机已装的那个；也可写死 chrome / msedge。
    # 解析结果会显示在控制台"系统"页，不做静默降级。
    channel: auto
    # 显式指定浏览器可执行文件，优先级高于 channel
    executable-path: ""
  self-check:
    # 启动自检页：用 data URL 断言 navigator.webdriver 等指纹
    enabled: true
  notify-config:
    wecom-webhook: ""
    throttle-window-seconds: 300
